<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contabilità Cantieri - Gestione Buca MT/BT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-slate-900 p-2.5 rounded-lg font-bold">
                    <i class="fa-solid fa-hard-hat text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Contabilità Rapida Cantiere</h1>
                    <p class="text-xs text-slate-400">Gestione Completa Scavi, Giunti MT/BT & Archeologia</p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <span class="text-xs bg-slate-800 text-amber-400 px-3 py-1 rounded-full border border-slate-700 font-mono">Listino Ufficiale Attivo</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Colonna Sinistra: Input Dati (7 Colonne) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Riferimenti Cantiere -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center">
                    <i class="fa-solid fa-location-dot text-amber-500 mr-2"></i> Riferimenti Cantiere
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Indirizzo / Località</label>
                        <input type="text" id="indirizzo" placeholder="es. Via Tiburtina 1431" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Riferimento / Picchetto</label>
                        <input type="text" id="picchetto" placeholder="es. PICCH. 12" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Dimensioni Buca & Tipologia -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center">
                    <i class="fa-solid fa-ruler-combined text-amber-500 mr-2"></i> Dimensioni Buca & Tipologia Impianto
                </h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Lunghezza (m)</label>
                        <input type="number" id="lunghezza" step="0.01" min="0" value="2.00" oninput="calcolaContabilita()" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Larghezza (m)</label>
                        <input type="number" id="larghezza" step="0.01" min="0" value="1.50" oninput="calcolaContabilita()" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Profondità (m)</label>
                        <input type="number" id="profondita" step="0.01" min="0" value="1.20" oninput="calcolaContabilita()" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Tensione Impianto</label>
                        <select id="tensioneImpianto" onchange="calcolaContabilita()" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            <option value="mt">Media Tensione (MT)</option>
                            <option value="bt">Bassa Tensione (BT)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Superficie Scavo</label>
                        <select id="tipoPavimento" onchange="calcolaContabilita()" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            <option value="sterrato">Sterrato / Campagna</option>
                            <option value="asfalto">Asfalto / Selciato</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Metri Lineari Cavo</label>
                        <input type="number" id="metriCavo" step="0.1" min="0" value="5.0" oninput="calcolaContabilita()" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Opzioni & Sicurezza -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center">
                    <i class="fa-solid fa-shield-halved text-amber-500 mr-2"></i> Opzioni e Sicurezza
                </h2>
                
                <div class="space-y-3 text-sm">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="chkDiscarica" checked onchange="calcolaContabilita()" class="rounded text-amber-600 focus:ring-amber-500 h-4 w-4">
                        <span>Carico e trasporto a discarica materiale di risulta</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="chkOneri" checked onchange="calcolaContabilita()" class="rounded text-amber-600 focus:ring-amber-500 h-4 w-4">
                        <span>Oneri cantiere per buche (SIC.E 02 / SIC.E 04)</span>
                    </label>
                </div>
            </div>

        </div>

        <!-- Colonna Destra: Riepilogo Contabile (5 Colonne) -->
        <div class="lg:col-span-5 space-y-6">
            
            <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-xl sticky top-6 border border-slate-800">
                <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                    <h2 class="text-lg font-bold text-amber-400 flex items-center">
                        <i class="fa-solid fa-file-invoice-dollar mr-2"></i> Contabilità Stimata
                    </h2>
                    <span id="superficieCalcolata" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded font-mono">0.00 mq</span>
                </div>

                <!-- Tabella Voci Generate -->
                <div class="py-4 max-h-[380px] overflow-y-auto space-y-3 pr-1" id="listaVociContabili">
                    <!-- Popolato dinamicamente via JS -->
                </div>

                <!-- Totale Generale -->
                <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between items-center">
                    <div>
                        <span class="text-xs text-slate-400 block">IMPORTO TOTALE STIMATO</span>
                        <span class="text-xs text-slate-500 font-mono">(IVA esclusa)</span>
                    </div>
                    <div class="text-2xl font-black text-amber-400 font-mono" id="totaleGenerale">€ 0,00</div>
                </div>

                <!-- Bottoni Azione -->
                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button onclick="azzeraCampi()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2.5 px-4 rounded-lg transition border border-slate-700">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Pulisci
                    </button>
                    <button onclick="copiaRiepilogo()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 text-xs font-bold py-2.5 px-4 rounded-lg transition shadow-sm">
                        <i class="fa-solid fa-copy mr-1"></i> Copia Report
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- Script Logica di Calcolo -->
    <script>
        const LISTINO = {
            // MT
            buca_mt_sterrato: 925.50,   // 20E.A01.04.01 (fino a 8 mq)[cite: 1]
            buca_mt_asfalto: 1169.39,   // 20E.A01.04.02 (fino a 8 mq)[cite: 1]
            giunto_mt_terna: 349.14,    // 15E.C01.02.15[cite: 1]
            posa_cavo_mt: 3.56,         // 15E.C01.01.06[cite: 1]

            // BT
            buca_bt_sterrato: 535.85,   // 15E.A01.04.04 (fino a 4 mq)[cite: 1]
            buca_bt_asfalto: 654.27,    // 15E.A01.04.06 (fino a 4 mq)[cite: 1]
            giunto_bt: 35.80,           // 15E.C01.02.08 (<50)[cite: 1]
            posa_cavo_bt: 1.63,         // 15E.C01.01.08 (fino 50mmq)[cite: 1]
            
            // Archeologia
            archeologia_primi_3m: 232.00, // 15C.B04.02.02[cite: 1]
            archeologia_extra: 6.00,      // 15C.B04.02.03[cite: 1]

            // Trasporti e Sicurezza
            discarica_ton: 16.17,       
            oneri_asfalto: 39.96,       
            oneri_sterrato: 29.39       
        };

        function calcolaContabilita() {
            const lung = parseFloat(document.getElementById('lunghezza').value) || 0;
            const larg = parseFloat(document.getElementById('larghezza').value) || 0;
            const prof = parseFloat(document.getElementById('profondita').value) || 0;
            const metriCavo = parseFloat(document.getElementById('metriCavo').value) || 0;
            const tensione = document.getElementById('tensioneImpianto').value;
            const pavimento = document.getElementById('tipoPavimento').value;

            const mq = lung * larg;
            const mc = mq * prof;
            const tonnellate = mc * 1.6;

            document.getElementById('superficieCalcolata').innerText = mq.toFixed(2) + ' mq (' + mc.toFixed(2) + ' mc)';

            let voci = [];
            let totale = 0;

            // 1. Gestione Buca Scavo (MT o BT, Sterrato o Asfalto)
            if (tensione === 'mt') {
                if (pavimento === 'asfalto') {
                    voci.push({ codice: '20E.A01.04.02', desc: 'Buca giunti MT su asfalto (fino a 8 mq)', qta: 1, u: 'cad', prz: LISTINO.buca_mt_asfalto });
                } else {
                    voci.push({ codice: '20E.A01.04.01', desc: 'Buca giunti MT su sterrato (fino a 8 mq)', qta: 1, u: 'cad', prz: LISTINO.buca_mt_sterrato });
                }
            } else {
                if (pavimento === 'asfalto') {
                    voci.push({ codice: '15E.A01.04.06', desc: 'Buca giunti BT su asfalto (fino a 4 mq)', qta: 1, u: 'cad', prz: LISTINO.buca_bt_asfalto });
                } else {
                    voci.push({ codice: '15E.A01.04.04', desc: 'Buca giunti BT su sterrato (fino a 4 mq)', qta: 1, u: 'cad', prz: LISTINO.buca_bt_sterrato });
                }
            }

            // 2. Giunti (Terna se MT, singolo se BT)
            if (tensione === 'mt') {
                voci.push({ codice: '15E.C01.02.15', desc: 'Esecuzione Terna di Giunti MT', qta: 1, u: 'n', prz: LISTINO.giunto_mt_terna });
            } else {
                voci.push({ codice: '15E.C01.02.08', desc: 'Giunto BT <50 mmq', qta: 1, u: 'n', prz: LISTINO.giunto_bt });
            }

            // 3. Posa Cavo / Linea
            if (metriCavo > 0) {
                if (tensione === 'mt') {
                    voci.push({ codice: '15E.C01.01.06', desc: 'Posa Linea MT in cavidotto', qta: metriCavo, u: 'm', prz: LISTINO.posa_cavo_mt });
                } else {
                    voci.push({ codice: '15E.C01.01.08', desc: 'Posa cavo BT fino 50mmq', qta: metriCavo, u: 'm', prz: LISTINO.posa_cavo_bt });
                }
            }

            // 4. Archeologia
            if (metriCavo > 0) {
                voci.push({ codice: '15C.B04.02.02', desc: 'Sorveglianza archeologica (primi 3 metri)', qta: 1, u: 'cad', prz: LISTINO.archeologia_primi_3m });
                let metriSuccessivi = Math.max(0, metriCavo - 3);
                if (metriSuccessivi > 0) {
                    voci.push({ codice: '15C.B04.02.03', desc: 'Sorveglianza archeologica (metri successivi oltre i 3m)', qta: metriSuccessivi, u: 'mt', prz: LISTINO.archeologia_extra });
                }
            }

            // 5. Trasporto e Discarica
            if (document.getElementById('chkDiscarica').checked && tonnellate > 0) {
                voci.push({ codice: '15C.C01.03.02', desc: 'Carico, trasporto e conferimento a discarica', qta: tonnellate.toFixed(2), u: 't', prz: LISTINO.discarica_ton });
            }

            // 6. Oneri di Cantiere e Sicurezza
            if (document.getElementById('chkOneri').checked) {
                if (pavimento === 'asfalto') {
                    voci.push({ codice: 'SIC.E 02', desc: 'Oneri cantiere per buche asfalto', qta: 1, u: 'n', prz: LISTINO.oneri_asfalto });
                } else {
                    voci.push({ codice: 'SIC.E 04', desc: 'Oneri cantiere per buche sterrato', qta: 1, u: 'n', prz: LISTINO.oneri_sterrato });
                }
            }

            // Renderizzazione HTML
            let container = document.getElementById('listaVociContabili');
            container.innerHTML = '';

            voci.forEach(item => {
                let importoVoce = item.qta * item.prz;
                totale += importoVoce;

                let htmlCard = `
                    <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/60 text-xs">
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-mono text-amber-400 font-bold">${item.codice}</span>
                            <span class="font-mono font-bold text-white">€ ${importoVoce.toFixed(2)}</span>
                        </div>
                        <p class="text-slate-300 mb-1">${item.desc}</p>
                        <div class="text-slate-400 text-[10px] flex justify-between">
                            <span>Qta: ${item.qta} ${item.u}</span>
                            <span>Unitario: € ${item.prz.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += htmlCard;
            });

            document.getElementById('totaleGenerale').innerText = '€ ' + totale.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function azzeraCampi() {
            document.getElementById('lunghezza').value = 2.00;
            document.getElementById('larghezza').value = 1.50;
            document.getElementById('profondita').value = 1.20;
            document.getElementById('metriCavo').value = 5.0;
            document.getElementById('indirizzo').value = '';
            document.getElementById('picchetto').value = '';
            calcolaContabilita();
        }

        function copiaRiepilogo() {
            const indirizzo = document.getElementById('indirizzo').value || 'Non specificato';
            const picchetto = document.getElementById('picchetto').value || 'N/D';
            const totale = document.getElementById('totaleGenerale').innerText;
            
            let testo = `=== RIEPILOGO CONTABILE CANTIERE ===\n`;
            testo += `Indirizzo: ${indirizzo}\n`;
            testo += `Picchetto: ${picchetto}\n`;
            testo += `Superficie Buca: ${document.getElementById('superficieCalcolata').innerText}\n`;
            testo += `Totale Stimato: ${totale}\n`;

            navigator.clipboard.writeText(testo);
            alert('Riepilogo copiato negli appunti con successo!');
        }

        window.onload = calcolaContabilita;
    </script>
</body>
</html>
